<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"
     role="img" aria-labelledby="heroTitle heroDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <title id="heroTitle">LobsterLaunch — one-click OpenClaw auto-setup</title>
  <desc id="heroDesc">A terminal window showing the LobsterLaunch wizard: run one command, answer five questions, and it installs and configures OpenClaw, ready in under two minutes. Bilingual English and Chinese.</desc>

  <defs>
    <linearGradient id="lobster" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="0.5" stop-color="#FF2D2D"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="500" rx="16" fill="#0D0D0D"/>
  <rect width="1200" height="500" rx="16" fill="url(#glow)"/>

  <!-- Terminal window -->
  <g>
    <rect x="40" y="40" width="1120" height="420" rx="14" fill="#16181A" stroke="#2B2E31"/>
    <!-- title bar -->
    <circle cx="72" cy="61" r="6" fill="#FF5F56"/>
    <circle cx="92" cy="61" r="6" fill="#FFBD2E"/>
    <circle cx="112" cy="61" r="6" fill="#27C93F"/>
    <text x="600" y="66" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#7A7F85">lobster-launch — zsh</text>
    <line x1="41" y1="82" x2="1159" y2="82" stroke="#26292C"/>

    <!-- prompt -->
    <text x="72" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <tspan fill="#FF6B35" font-weight="700">$</tspan><tspan fill="#E8EAED"> curl -fsSL https://lobsterlaunch.dev/install | bash</tspan>
    </text>

    <!-- wordmark banner -->
    <text x="70" y="187" font-size="54" font-weight="800" fill="url(#lobster)" letter-spacing="-1">LobsterLaunch</text>
    <text x="632" y="185" font-size="42">🦞</text>

    <!-- bilingual subtitle box (boxen-style) -->
    <rect x="72" y="210" width="724" height="70" rx="10" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
    <text x="92" y="242" font-size="18" fill="#E8EAED">One-click OpenClaw setup — ready in under 2 minutes</text>
    <text x="92" y="267" font-size="14" fill="#8A9099">一键安装 OpenClaw — 不到 2 分钟即可就绪</text>

    <!-- wizard step ribbon -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <text x="72" y="318"><tspan fill="#FF6B35" font-weight="700">[1/7]</tspan><tspan fill="#C9CDD2"> System check</tspan></text>
      <text x="440" y="318" fill="#00D26A">✓ macOS · Node 24 · net OK</text>

      <text x="72" y="348"><tspan fill="#FF6B35" font-weight="700">[2/7]</tspan><tspan fill="#C9CDD2"> AI model → Claude</tspan></text>
      <text x="440" y="348" fill="#00D26A">✓ key saved · 8 skills</text>

      <text x="72" y="378"><tspan fill="#FF6B35" font-weight="700">[6/7]</tspan><tspan fill="#C9CDD2"> Security hardening</tspan></text>
      <text x="440" y="378" fill="#00D26A">✓ localhost · approval · rate-limit</text>
    </g>

    <!-- success box -->
    <rect x="72" y="398" width="1016" height="44" rx="10" fill="#0F2018" stroke="#00D26A" stroke-width="1.2"/>
    <text x="92" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
      <tspan fill="#00D26A" font-weight="700">🦞 OpenClaw is ready!</tspan><tspan fill="#C9CDD2">   Dashboard → http://127.0.0.1:18789/</tspan>
    </text>
  </g>
</svg>
